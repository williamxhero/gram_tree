name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  server:
    name: 服务端检查和接口测试
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: 安装 PostgreSQL 16 客户端（备份演练用 pg_dump/pg_restore）
        run: |
          sudo apt-get install -y -q postgresql-client-16 || true
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run alembic heads | tee /dev/stderr | wc -l | grep -qx 1
        env:
          GRAMTREE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      - run: uv run pytest -q
      - run: uv run alembic check
        env:
          GRAMTREE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gramtree_test

  ingredient-data:
    name: 食材库数据校验
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - name: 校验食材库数据（含 origin/main 标准 ID 基线）
        shell: bash
        run: |
          baseline_dir="$(mktemp -d)"
          while IFS= read -r path; do
            target="$baseline_dir/${path#server/data/ingredients/}"
            mkdir -p "$(dirname "$target")"
            git show "origin/main:$path" > "$target"
          done < <(git ls-tree -r --name-only origin/main server/data/ingredients | grep '\.json$' || true)
          if [[ -f "$baseline_dir/manifest.json" ]]; then
            uv run gramtree ingredients validate data/ingredients --baseline-dir "$baseline_dir"
          else
            # 第一次把食材库引入基线时没有可比较的历史目录。
            uv run gramtree ingredients validate data/ingredients
          fi

  server-image:
    name: 服务端镜像能构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gramtree-server:ci server
      - name: 镜像里的备份工具能用
        run: docker run --rm gramtree-server:ci sh -c "pg_dump --version && rclone version | head -1 && gramtree --help"

  api-contract:
    name: OpenAPI 描述和 Dart 客户端与服务端一致
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: (cd server && uv sync --frozen)
      - run: tool/check_api_client.sh

  app:
    name: App 检查、页面测试、网页版构建
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - name: 页面测试在浏览器里再跑一遍
        run: flutter test --platform chrome
      - run: flutter build web --dart-define=APP_ENV=staging

  web-e2e:
    name: 网页版端到端测试
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: (cd server && uv sync --frozen)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: tool/web_test.sh
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}

  android-e2e:
    name: 安卓模拟器端到端测试
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: (cd server && uv sync --frozen)
      - name: 启动端到端用的服务端（模拟器里通过 10.0.2.2 访问）
        run: tool/e2e_server.sh start
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: (cd app && flutter pub get)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: app
          script: flutter test integration_test --dart-define=APP_ENV=dev --dart-define=API_BASE_URL=http://10.0.2.2:8000 -d emulator-5554
      - name: 服务端日志
        if: failure()
        run: cat /tmp/gramtree_e2e_server.log || true

  ios-e2e:
    name: iOS 模拟器端到端测试（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 装数据库和 Redis（macOS 机器没有服务容器）
        run: |
          brew install postgresql@17 pgvector redis
          brew services start postgresql@17
          brew services start redis
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          until pg_isready -h localhost; do sleep 1; done
          createuser -h localhost -s postgres
          psql -h localhost -d postgres -c "ALTER USER postgres PASSWORD 'postgres'"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: (cd server && uv sync --frozen) && tool/e2e_server.sh start
      - name: 启动 iPhone 模拟器
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - run: cd app && flutter pub get && flutter test integration_test -d "$SIM_UDID"
