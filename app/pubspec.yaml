name: gram_tree
description: "味谱 GramTree — recipe app client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  dio: ^5.7.0
  gramtree_api:
    path: packages/gramtree_api
  sentry_flutter: ^9.30.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.2.0
  permission_handler: ^13.0.2
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
