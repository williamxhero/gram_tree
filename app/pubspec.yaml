name: gram_tree
description: "味谱 GramTree — recipe app client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  dio: ^5.7.0
  gramtree_api:
    path: packages/gramtree_api
  sentry_flutter: ^9.30.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.2.0
  # 13.x 的安卓实现要求 compileSdk 37，当前 Android Gradle 插件最高支持 36；升级插件后再升
  permission_handler: ^12.0.3
  image_picker: ^1.2.0
  image: ^4.5.4
  flutter_timezone: ^5.1.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  package_info_plus: ^10.2.1
  json_schema: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/serving_conversion_cases.json
    - assets/mold_conversion_cases.json
