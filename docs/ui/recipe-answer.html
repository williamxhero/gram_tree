<main><h1>宫保鸡丁</h1><p class="version">我的第 1 版 · 2 人份</p><section><h2>必显安全提示</h2><p>鸡肉表面变白不代表中心熟透，请检查中心温度达到 74°C。</p><button>调整人数</button> <button>表单编辑</button></section>

<dialog id="why"><h2>为什么 · AI 估算 · 一般经验</h2><h3 id="status">已回答</h3><p id="conclusion"></p><p>这是一般经验，还没有足够记录验证</p><p id="basis"></p><details open><summary>明细与限制</summary><p>基于当前第 1 版。没有平台证据；静态设计思路不是实证。本解释不会自动改动、保存或发布版本。</p><p>必显：鸡肉中心温度达到 74°C；未知食材的过敏原信息可能不完整。</p></details><button onclick="document.getElementById('why').close()">关闭</button></dialog>
