<!doctype html><html lang="zh"><meta charset="utf-8"><title>SPEC-013.3 在线入口降级样稿</title><style>:root{color-scheme:light dark;--paper:#F7F4EE;--card:#FFFDF9;--ink:#1B1813;--line:#d7d0c6}*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',sans-serif;max-width:760px;margin:32px auto;padding:16px}h1,h2{font-family:'Noto Serif SC',serif}section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}button,textarea{font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line)}button{background:var(--ink);color:var(--card);margin:6px 0}button:disabled{opacity:.45}textarea{width:100%;background:var(--paper);color:var(--ink)}small{display:block;margin:8px 0;line-height:1.6}@media(prefers-color-scheme:dark){:root{--paper:#1B1813;--card:#25211b;--ink:#F7F4EE;--line:#51483e}}</style><h1>新建 · 网络连接不到服务</h1><section><h2>想做点什么？</h2><button>手动新建菜谱</button><br><button disabled>一句话生成菜谱 · 需要联网</button><small>需要联网：暂时连接不到服务，请检查网络；本机内容仍可使用。</small></section><section><h2>一句话生成菜谱</h2><textarea>想做一道不辣的宫保鸡丁</textarea><button disabled>先找已有菜谱 · 需要联网</button><small>原话与已有结果保留，连接恢复后入口自动恢复。离线手工编辑、缓存菜谱与本地食材检索不受影响。</small><button>不用 AI，手动新建</button></section><section><h2>已有本机内容</h2><p>上次保存的菜谱与换算用量继续显示，不重新计算服务端结果。</p><small>没有缓存时明确说明本机没有这份内容；不生成空菜单或占位推荐。</small></section></html>
