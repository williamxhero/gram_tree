# 本机开发：docker compose up
# 启动 API（http://localhost:8000/v1/health）、PostgreSQL + pgvector、Redis、任务进程和定时调度。
x-app: &app
  build: .
  environment:
    GRAMTREE_ENV: dev
    GRAMTREE_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/gramtree
    GRAMTREE_REDIS_URL: redis://redis:6379/0
    GRAMTREE_BACKUP_DIR: /var/backups/gramtree
    GRAMTREE_RECIPE_STORAGE_BACKEND: s3
    GRAMTREE_RECIPE_S3_ENDPOINT_URL: http://minio:9000
    GRAMTREE_RECIPE_S3_PUBLIC_ENDPOINT_URL: http://localhost:19000
    GRAMTREE_RECIPE_S3_BUCKET: gramtree-private
    GRAMTREE_RECIPE_S3_REGION: us-east-1
    GRAMTREE_RECIPE_S3_ACCESS_KEY_ID: minioadmin
    GRAMTREE_RECIPE_S3_SECRET_ACCESS_KEY: minioadmin-local-only
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gramtree
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local-only
    ports: ["19000:9000", "19001:9001"]
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 minioadmin minioadmin-local-only; do sleep 1; done
      && mc mb --ignore-existing local/gramtree-private"

  api:
    <<: *app
    ports: ["8000:8000"]
    volumes: [".:/srv", "/srv/.venv"]
    command: sh -c "alembic upgrade head && uvicorn gramtree.asgi:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    <<: *app
    volumes: [".:/srv", "/srv/.venv", "backups:/var/backups/gramtree"]
    command: celery -A gramtree.tasks.celery_app worker --beat -l info

volumes:
  db-data:
  minio-data:
  backups:
