[project]
name = "gramtree-server"
version = "0.1.0"
description = "味谱（GramTree）服务端"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "tzdata>=2024.1",
    "jsonschema>=4.23",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "celery-types>=0.26.0",
]

[project.scripts]
gramtree = "gramtree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gramtree"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["gramtree", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
